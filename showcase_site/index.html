<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUTO-BANNER // ENGINE</title>

  <!-- Google Fonts: Space Grotesk, JetBrains Mono, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  />

  <!-- Swiss Cybernetic Brutalism Design System -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/keepsake-folder.css" />
  <link rel="stylesheet" href="css/hotspot-controller.css" />
</head>
<body class="blueprint-canvas">
  <!-- Global Fixed HUD Header -->
  <header class="hud-header" role="banner">
    <div class="shell-container hud-inner">
      <a href="#zone-hero" class="hud-brand" aria-label="AUTO-BANNER // ENGINE">
        <span class="beacon-dot" aria-hidden="true"></span>
        <span>AUTO-BANNER // ENGINE</span>
      </a>

      <nav class="hud-nav" aria-label="Primary Navigation">
        <a href="#zone-hero" class="ghost-nav-link" data-i18n="nav.overview"></a>
        <a href="#zone-xexymix" class="ghost-nav-link" data-i18n="nav.xexymix"></a>
        <a href="#zone-meritz" class="ghost-nav-link" data-i18n="nav.meritz"></a>
        <a href="#zone-under-the-hood" class="ghost-nav-link" data-i18n="nav.telemetry"></a>
        <a href="#zone-manifest-engine" class="ghost-nav-link" data-i18n="nav.engine"></a>
      </nav>

      <div class="hud-actions">
        <div class="lang-switcher-pill" role="group" aria-label="Language Selector"><button class="lang-btn active" data-lang="ko">KO</button><button class="lang-btn" data-lang="en">EN</button><button class="lang-btn" data-lang="vi">VI</button></div>
        <a href="#deliverables-dock" class="hud-cta-download">
          <span data-i18n="nav.download"></span>
          <span aria-hidden="true">&darr;</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Blueprint Stage -->
  <main id="showcase-root">
    <!-- Zone 01: Hero & CAD Viewport -->
    <section id="zone-hero" class="zone-section" aria-labelledby="hero-heading">
      <div class="shell-container">
        <div class="hero-meta-row">
          <span class="amber-badge" data-i18n="hero.badge_engine"></span>
          <span class="meta-pill" data-i18n="hero.system_status"></span>
        </div>

        <h1 id="hero-heading" class="hero-wordmark">
          <span data-i18n="hero.title_line1"></span>
          <span class="slash-accent">//</span>
          <span data-i18n="hero.title_highlight"></span>
        </h1>

        <p class="hero-lead" data-i18n="hero.subtitle"></p>

        <!-- Command Bar (160px Pill Radius) -->
        <div class="hero-command-bar" role="region" aria-label="Command Telemetry">
          <div class="command-prompt">
            <span class="command-prompt-prefix">&gt;_</span>
            <span data-i18n="hero.command_placeholder"></span>
          </div>
          <div class="command-meta-pills">
            <span class="meta-pill" data-i18n="hero.pill_task1"></span>
            <span class="meta-pill" data-i18n="hero.pill_task2"></span>
            <span class="meta-pill" data-i18n="hero.pill_qa"></span>
          </div>
        </div>

        <!-- Hero CAD Viewport (16px Radius) -->
        <div class="hero-cad-viewport" data-viewport="hero-cad">
          <div class="placeholder-telemetry" data-hero-telemetry></div>
          <div class="hero-cad-stage">
            <div class="hero-cad-canvas-wrap">
              <div id="hero-three-container" style="width: 100%; height: 100%; position: relative;"></div>
              <svg class="hero-cad-hud-overlay" viewBox="0 0 800 500" preserveAspectRatio="none" aria-hidden="true">
                <line x1="24" y1="24" x2="76" y2="24" class="laser-stroke-cyan" />
                <line x1="24" y1="24" x2="24" y2="76" class="laser-stroke-cyan" />
                <line x1="776" y1="24" x2="724" y2="24" class="laser-stroke-cyan" />
                <line x1="776" y1="24" x2="776" y2="76" class="laser-stroke-cyan" />
                <line x1="24" y1="476" x2="76" y2="476" class="laser-stroke-cyan" />
                <line x1="24" y1="476" x2="24" y2="424" class="laser-stroke-cyan" />
                <line x1="776" y1="476" x2="724" y2="476" class="laser-stroke-cyan" />
                <line x1="776" y1="476" x2="776" y2="424" class="laser-stroke-cyan" />
              </svg>
            </div>
          </div>

          <!-- Floating Hotspot Flyout Popups (Hidden by default; controlled by upcoming hotspot controller) -->
          <div id="hero-hotspot-popups">
            <div class="hotspot-flyout-card" id="popup-spec-card" aria-hidden="true">
              <div class="hero-cad-telemetry-panel" data-hero-panel></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Zone 02: Workflow A — XEXYMIX 11-Ratio Interactive Keepsake Folder -->
    <section id="zone-xexymix" class="zone-section" aria-labelledby="xexymix-heading">
      <div class="shell-container">
        <span class="zone-eyebrow" data-i18n="task1_xexymix.badge"></span>
        <div class="zone-header">
          <h2 id="xexymix-heading" class="zone-title" data-i18n="task1_xexymix.title"></h2>
          <p class="zone-subtitle" data-i18n="task1_xexymix.description"></p>
        </div>

        <div class="zone-stage-placeholder" data-zone-mount="task1_xexymix">
          <div class="xexymix-meta-header" data-xexymix-meta></div>
          <div class="keepsake-container"></div>
          <div class="keepsake-zip-cta-wrap">
            <a
              id="xexymix-master-zip-btn"
              href="./deliverables/task1_xexymix/xexymix_11_sizes.zip"
              download="xexymix_11_sizes.zip"
              class="keepsake-master-zip-btn"
            >
              <svg class="keepsake-zip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span data-i18n="keepsake.btn_download_zip">DOWNLOAD ALL 11 SIZES (.ZIP)</span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- Zone 03: Workflow B — Meritz Dual-Core Option 1 & Option 2 A/B Container -->
    <section id="zone-meritz" class="zone-section" aria-labelledby="meritz-heading">
      <div class="shell-container">
        <span class="zone-eyebrow" data-i18n="task2_meritz.badge"></span>
        <div class="zone-header">
          <h2 id="meritz-heading" class="zone-title" data-i18n="task2_meritz.title"></h2>
          <p class="zone-subtitle" data-i18n="task2_meritz.description"></p>
        </div>

        <div class="zone-stage-placeholder" data-zone-mount="task2_meritz"></div>
      </div>
    </section>

    <!-- Zone 04: Under The Hood — Telemetry & Multi-Agent Orchestration Console -->
    <section id="zone-under-the-hood" class="zone-section" aria-labelledby="telemetry-heading">
      <div class="shell-container">
        <span class="zone-eyebrow" data-i18n="under_the_hood.badge"></span>
        <div class="zone-header">
          <h2 id="telemetry-heading" class="zone-title" data-i18n="under_the_hood.title"></h2>
          <p class="zone-subtitle" data-i18n="under_the_hood.description"></p>
        </div>

        <div class="zone-stage-placeholder qa-telemetry-stage" data-zone-mount="under_the_hood"></div>
      </div>
    </section>

    <!-- Zone 05: Manifest-Driven White-Label Sandbox -->
    <section id="zone-manifest-engine" class="zone-section" aria-labelledby="manifest-heading">
      <div class="shell-container">
        <span class="zone-eyebrow" data-i18n="manifest_engine.badge"></span>
        <div class="zone-header">
          <h2 id="manifest-heading" class="zone-title" data-i18n="manifest_engine.title"></h2>
          <p class="zone-subtitle" data-i18n="manifest_engine.description"></p>
        </div>

        <div class="zone-stage-placeholder" data-zone-mount="manifest_engine"></div>
      </div>
    </section>
  </main>

  <!-- Zone 06: Footer Deliverables Dock -->
  <footer id="deliverables-dock" class="deliverables-dock" role="contentinfo">
    <div class="shell-container dock-grid">
      <div>
        <div class="hud-brand">
          <span class="beacon-dot" aria-hidden="true"></span>
          <span data-i18n="footer.download_title"></span>
        </div>
        <p class="dock-status" data-i18n="footer.download_desc"></p>
      </div>

      <div class="dock-links" data-zone-mount="deliverables_dock"></div>
    </div>
  </footer>

  <script src="js/i18n.js" defer></script>
  <script src="js/keepsake-folder.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
