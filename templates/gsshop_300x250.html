<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=300, height=250, initial-scale=1.0" />
  <title>GS SHOP MREC Banner 300x250 — DIR-BUILD-RESIZE-ENGINE-063</title>
  <style>
    @font-face {
      font-family: "Pretendard";
      src: url("{{ font_base }}/Pretendard-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Pretendard";
      src: url("{{ font_base }}/Pretendard-SemiBold.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Pretendard";
      src: url("{{ font_base }}/Pretendard-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Pretendard";
      src: url("{{ font_base }}/Pretendard-ExtraBold.woff2") format("woff2");
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 300px;
      height: 250px;
      overflow: hidden;
      background: #96dbfc;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    /* =========================================================================
       GS SHOP 300x250 MREC (6:5) — COMPACT HIGH-LEGIBILITY VERTICAL STACK
       Boosted Pretendard typography & CTA for crisp readability at 300px;
       Compact centered gift box stage preserving all 4 hero items & decor.
       Safe Margins: top 12, bottom 12, left 14, right 14 (AdChoices clear x>=265,y<=20)
       ========================================================================= */
    .stage {
      position: relative;
      width: 300px;
      height: 250px;
      overflow: hidden;
      isolation: isolate;
    }

    .layer {
      position: absolute;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .layer img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Z=1: Winter Sky Backdrop */
    .z1-bg-winter-backdrop {
      z-index: 1;
      top: 0px;
      left: 0px;
      width: 300px;
      height: 250px;
    }
    .z1-bg-winter-backdrop img {
      object-fit: cover;
    }

    /* Z=2: Snow Tier 1 Back Dunes */
    .z2-snow-tier-1 {
      z-index: 2;
      top: 174px;
      left: 0px;
      width: 300px;
      height: 76px;
      overflow: hidden;
    }
    .z2-snow-tier-1 img {
      position: absolute;
      left: -26px;
      top: -110px;
      width: 352px;
      height: 230px;
      max-width: none;
      max-height: none;
      object-fit: fill;
    }

    /* Z=3: Snow Tier 2 Box Bed */
    .z3-snow-tier-2 {
      z-index: 3;
      top: 0px;
      left: 0px;
      width: 300px;
      height: 250px;
      overflow: hidden;
    }
    .z3-snow-tier-2 img {
      position: absolute;
      left: 0px;
      top: 0px;
      width: 300px;
      height: 250px;
      max-width: none;
      max-height: none;
      object-fit: fill;
    }

    /* Shared-Camera 1:1 Box Projection (virtual 180x180 @ left: 60px, top: 82px) */
    /* Z=4: Box Contact Shadow */
    .z4-box-contact-shadow {
      z-index: 4;
      top: 218px;
      left: 103px;
      width: 107px;
      height: 40px;
      overflow: visible;
      opacity: 0.88;
    }
    .z4-box-contact-shadow img {
      position: absolute;
      left: -43px;
      top: -136px;
      width: 180px;
      height: 180px;
      max-width: none;
      max-height: none;
      object-fit: fill;
    }

    /* Z=5: Box Back Interior */
    .z5-box-back-interior {
      z-index: 5;
      top: 151px;
      left: 103px;
      width: 107px;
      height: 85px;
      overflow: visible;
      filter: drop-shadow(0 3px 5px rgba(15, 35, 75, 0.16));

    .z5-box-back-interior img {

      height: 180px;
      max-width: none;
      max-height: none;

    }

    /* Z=6: Tucked Items (Toilet Paper + Tangerines inside box cavity) */
    .z6-toilet-paper,
    .z6-toilet-paper-copy {
      z-index: 6;

    .z6-toilet-paper {

      height: 56px;

      transform-origin: center bottom;
    }
    .z6-toilet-paper img,
    .z6-toilet-paper-copy img {

      top: -10px;

      max-height: none;

    .z6-tangerine-cluster-copy {

    /* Z=7: Box Front Rim + Shared-Camera Ribbon Tails */
    .z7-box-front-rim {
      z-index: 7;

      left: 103px;
      width: 107px;
      height: 60px;
      overflow: visible;
      filter:
        drop-shadow(0 4px 6px rgba(15, 35, 75, 0.24))
        drop-shadow(0 1px 3px rgba(15, 76, 129, 0.16));
    }
    .z7-box-front-rim img {
      position: absolute;
      left: -43px;
      top: -94px;
      width: 180px;
      height: 180px;
      max-width: none;
      max-height: none;
      object-fit: fill;
    }

    .z7-ribbon-flutter-left,
    .z7-ribbon-flutter-right {
      z-index: 7;
      top: 82px;
      left: 60px;
      width: 180px;
      height: 180px;
      overflow: visible;
      filter: drop-shadow(0px 2px 3px rgba(30, 58, 138, 0.30));
    }

    /* Z=8: Burst Heroes (All positioned cleanly below headline y=106) */
    .z8-shopping-bag-pink {
      z-index: 8;
      top: 107px;
      left: 204px;
      width: 60px;
      height: 60px;
      transform: rotate(26deg);
      transform-origin: center center;
      filter: drop-shadow(0 4px 6px rgba(15, 23, 42, 0.22));
    }

    .z8-knit-sweater {
      z-index: 8;
      top: 120px;
      left: 66px;
      width: 88px;
      height: 88px;
      transform: rotate(-15deg);
      transform-origin: center center;
      filter: drop-shadow(0 5px 6px rgba(15, 23, 42, 0.25));

    .z8-puffer-jacket {
      z-index: 8;
      top: 112px;

      width: 108px;
      height: 108px;
      transform: rotate(16deg);
      transform-origin: center center;

    /* Z=9: Flying Box Lid */
    .z9-box-lid-flying {
      z-index: 10;
      top: 112px;
      left: 14px;
      width: 82px;
      height: 56px;
      transform: rotate(-16deg);
      transform-origin: center center;
      overflow: visible;
      filter: drop-shadow(0 5px 7px rgba(10, 25, 49, 0.20));
    }
    .z9-box-lid-flying img {

      top: -10px;
      width: 136px;
      height: 136px;
      max-width: none;
      max-height: none;
      object-fit: fill;
    }

    /* Z=10: Floating Festive Decor Accents */
    .z10-flying-tangerine-left,
    .z10-flying-tangerine-right {
      z-index: 10;
      overflow: visible;
      transform-origin: center center;
      filter: drop-shadow(2px 3px 2px rgba(249, 115, 22, 0.32));
    }
    .z10-flying-tangerine-left {
      top: 112px;
      left: 74px;
      width: 24px;
      height: 24px;
      transform: rotate(-20deg);
    }
    .z10-flying-tangerine-right {
      top: 112px;
      left: 196px;
      width: 24px;
      height: 24px;
      transform: rotate(20deg);
    }
    .z10-flying-tangerine-left .tangerine-fruit,
    .z10-flying-tangerine-right .tangerine-fruit {
      position: absolute;
      left: -3px;
      top: -2px;
      width: 30px;
      height: 30px;
      max-width: none;
      max-height: none;
      object-fit: contain;
    }
    .z10-flying-tangerine-left .tangerine-fruit {
      transform: scaleX(-1);
    }
    .z10-flying-tangerine-left .tangerine-leaves,
    .z10-flying-tangerine-right .tangerine-leaves {
      position: absolute;
      left: 3px;
      top: -7px;
      width: 16px;
      height: 16px;
      max-width: none;
      max-height: none;
      object-fit: contain;
      transform: rotate(-10deg);
    }

    .z10-decor-snowflake,
    .z10-decor-snowflake-copy {
      z-index: 10;
      overflow: visible;
      filter: drop-shadow(2px 2px 3px rgba(255, 255, 255, 0.82));
    }
    .z10-decor-snowflake {
      top: 166px;
      left: 52px;
      width: 26px;
      height: 26px;
    }
    .z10-decor-snowflake img {
      position: absolute;
      left: -3px;
      top: -3px;
      width: 32px;
      height: 32px;
      max-width: none;
      max-height: none;
      object-fit: contain;
      transform: scaleX(-1) rotate(-14deg);
    }
    .z10-decor-snowflake-copy {
      top: 158px;
      left: 238px;
      width: 26px;
      height: 26px;
    }
    .z10-decor-snowflake-copy img {
      position: absolute;
      left: -3px;
      top: -3px;
      width: 32px;
      height: 32px;
      max-width: none;
      max-height: none;
      object-fit: contain;
      transform: scaleX(-1) rotate(1deg);
    }

    .z10-decor-candy-cane {
      z-index: 9;
      top: 84px;
      left: 18px;
      width: 24px;
      height: 24px;
      overflow: visible;
      filter: drop-shadow(2px 3px 2px rgba(56, 189, 248, 0.32));
    }
    .z10-decor-candy-cane img {
      position: absolute;
      left: -4px;
      top: -4px;
      width: 32px;
      height: 32px;
      max-width: none;
      max-height: none;
      object-fit: contain;
      transform: rotate(-25deg) scaleX(-1);
    }

    .z10-decor-bauble {
      z-index: 10;
      top: 82px;
      left: 254px;
      width: 24px;
      height: 24px;
      transform: rotate(18deg);
      transform-origin: center center;
      filter:
        drop-shadow(-2px 3px 2px rgba(56, 189, 248, 0.36))
        drop-shadow(0 3px 5px rgba(15, 76, 129, 0.22));
    }

    .z10-decor-bauble-sparkles {
      z-index: 10;
      top: 62px;
      left: 234px;
      width: 64px;
      height: 64px;
      overflow: visible;
      pointer-events: none;
    }
    .z10-decor-bauble-sparkles svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* Z=11: Snow Tier 3 Front Waves */
    .z11-snow-tier-3 {
      z-index: 11;
      top: 0px;
      left: 0px;
      width: 300px;
      height: 250px;
      overflow: hidden;
    }
    .z11-snow-tier-3 img {
      position: absolute;
      left: 0px;
      top: 2px;
      width: 300px;
      height: 248px;
      max-width: none;
      max-height: none;
      object-fit: fill;
    }

    /* Z=12: Snow Particles Overlay */
    .z12-snow-particles {
      z-index: 12;
      top: 0px;
      left: 0px;
      width: 300px;
      height: 250px;
      opacity: 0.85;
    }
    .z12-snow-particles img {
      object-fit: cover;
    }

    /* =========================================================================
       Z=13: COMPACT HIGH-LEGIBILITY UI LOCKUP (300x250 MREC)
       ========================================================================= */
    .z13-logo-live-group {
      z-index: 13;
      top: 12px;
      left: 14px;
      width: 82px;
      height: 11px;
      pointer-events: auto;
    }

    .mobile-live-logo-wrap {
      position: relative;
      display: block;
      width: 82px;
      height: 11px;
      overflow: hidden;
    }

    .z13-logo-live-group .mobile-live-logo-img {
      position: absolute;
      left: -14.8px;
      top: -36.3px;
      width: 111.4px;
      height: 83.5px;
      max-width: none;
      max-height: none;
      object-fit: fill;
      display: block;
    }

    /* Compact High-Legibility Frosted Glass Capsule */
    .z13-glass-capsule-layer {
      z-index: 13;
      top: 27px;
      left: 50%;
      transform: translateX(-50%);
      width: auto;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .glass-subcopy-capsule {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 266px;
      gap: 6px;
      padding: 3px 10px 3px 5px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.90);
      border-radius: 9999px;
      box-shadow: 0 3px 10px -1px rgba(15, 23, 42, 0.12),
                  0 1px 2px rgba(255, 255, 255, 0.65) inset;
    }

    .glass-badge-live {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #DC2626;
      color: #FFFFFF;
      padding: 2.5px 6px;
      border-radius: 9999px;
      font-size: 8.5px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.3px;
      box-shadow: 0 1px 4px rgba(220, 38, 38, 0.35);
      flex-shrink: 0;
    }

    .live-dot {
      width: 4px;
      height: 4px;
      background-color: #FFFFFF;
      border-radius: 50%;
      display: inline-block;
    }

    .glass-divider {
      width: 1px;
      height: 10px;
      background: rgba(15, 23, 42, 0.18);
      flex-shrink: 0;
    }

    .glass-subcopy-text {
      color: #0F172A;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.35px;
      white-space: nowrap;
    }

    /* 3D Headline — Boosted scale for immediate 300px readability */
    .z13-headline-3d {
      z-index: 13;
      top: 52px;
      left: 14px;
      width: 272px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .headline-3d-lockup {
      position: relative;
      width: 158px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .headline-3d-lockup img {
      width: 298px;
      height: 78px;
      margin-top: 2px;
      max-width: none;
      max-height: none;
      flex-shrink: 0;
      object-fit: contain;
      display: block;
    }

    /* High-Legibility Bottom CTA Pill */
    .z13-cta-button {
      z-index: 13;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box;
      width: var(--synced-capsule-width, 266px);
      height: 27px;
      padding: 0 14px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      text-decoration: none;
      overflow: hidden;

      background: linear-gradient(
        180deg,
        #3392FF 0%,
        #1982FF 18%,
        #0F78FF 56%,
        #0C6CEB 88%,
        #167BFF 100%
      );
      border: 1px solid rgba(130, 194, 255, 0.82);
      box-shadow:
        0 4px 10px -2px rgba(15, 120, 255, 0.45),
        0 2px 5px rgba(15, 120, 255, 0.24),
        inset 0 1px 2px rgba(255, 255, 255, 0.44),
        inset 0 -2px 3px rgba(15, 92, 214, 0.30);
    }

    .z13-cta-button::before {
      content: "";
      position: absolute;
      top: 1px;
      left: 8px;
      right: 8px;
      height: 7px;
      border-radius: 9999px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.44) 0%,
        rgba(255, 255, 255, 0.14) 48%,
        rgba(255, 255, 255, 0.00) 100%
      );
      pointer-events: none;
    }

    .cta-pill-label {
      position: relative;
      z-index: 1;
      color: #FFFFFF;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }

    .cta-text {
      font-size: 16.5px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.45px;
      text-shadow: 0 1px 2px rgba(4, 48, 120, 0.42);
    }

    .cta-chevron {
      width: 8px;
      height: 12px;
      flex-shrink: 0;
      display: block;
      filter: drop-shadow(0 1px 2px rgba(4, 48, 120, 0.42));
    }
  </style>
</head>
<body>
  <main class="stage" id="master-stage" data-banner-id="{{ banner_id }}" data-format="300x250">
    <!-- Z=1: Winter Backdrop -->
    <div class="layer z1-bg-winter-backdrop"
         data-layer-id="z1_bg_winter_backdrop"
         data-layer-name="Z1_BG_WINTER_BACKDROP"
         data-z-index="1"
         data-motion-role="static_backdrop"
         data-parallax="0.02">
      <img id="asset_bg_winter_backdrop"
           data-asset-id="01_bg_winter_backdrop"
           data-repo-path="assets/brands/gsshop/layers/01_background_sky.png"
           src="{{ asset_base }}/01_background_sky.png"
           alt="Winter studio backdrop" />
    </div>

    <!-- Z=2: Snow Tier 1 Back -->
    <div class="layer z2-snow-tier-1"
         data-layer-id="z2_snow_tier_1_back_blur"
         data-layer-name="Z2_SNOW_TIER_1_BACK_BLUR"
         data-z-index="2"
         data-motion-role="snow_dune_back"
         data-parallax="0.06">
      <img id="asset_snow_tier_1"
           data-asset-id="snow_tier_1_back_blur"
           data-repo-path="assets/brands/gsshop/layers/02_snow_tier_1_back.png"
           src="{{ asset_base }}/02_snow_tier_1_back.png"
           alt="Background blurred snow dunes" />
    </div>

    <!-- Z=3: Snow Tier 2 Box Bed -->
    <div class="layer z3-snow-tier-2"
         data-layer-id="z3_snow_tier_2_box_bed"
         data-layer-name="Z3_SNOW_TIER_2_BOX_BED"
         data-z-index="3"
         data-motion-role="snow_bed_ground"
         data-parallax="0.10">
      <img id="asset_snow_tier_2"
           data-asset-id="snow_tier_2_box_bed"
           data-repo-path="assets/brands/gsshop/layers/03_snow_tier_2_box_bed.png"
           src="{{ asset_base }}/03_snow_tier_2_box_bed.png"
           alt="Main snow floor supporting gift box" />
    </div>

    <!-- Z=4: Box Contact Shadow -->
    <div class="layer z4-box-contact-shadow"
         data-layer-id="z4_box_contact_shadow"
         data-layer-name="Z4_BOX_CONTACT_SHADOW"
         data-z-index="4"
         data-motion-role="contact_shadow"
         data-parallax="0.14">
      <img id="asset_box_contact_shadow"
           data-asset-id="decor_box_contact_shadow"
           data-repo-path="assets/brands/gsshop/layers/04_decor_box_contact_shadow.png"
           src="{{ asset_base }}/04_decor_box_contact_shadow.png"
           alt="Gift box contact shadow" />
    </div>

    <!-- Z=5: Box Back Interior -->
    <div class="layer z5-box-back-interior"
         data-layer-id="z5_box_back_interior"
         data-layer-name="Z5_BOX_BACK_INTERIOR"
         data-z-index="5"
         data-motion-role="box_cavity_back"
         data-parallax="0.18">
      <img id="asset_box_back_interior"
           data-asset-id="decor_box_back_interior"
           data-repo-path="assets/brands/gsshop/layers/05_decor_box_back_interior.png"
           src="{{ asset_base }}/05_decor_box_back_interior.png"
           alt="Gift box back interior cavity" />
    </div>

    <!-- Z=6: Tucked Items -->
    <div class="layer z6-toilet-paper"
         data-layer-id="z6_toilet_paper"
         data-layer-name="Z6_TUCKED_ITEMS"
         data-z-index="6"
         data-motion-role="tucked_pop_left"
         data-parallax="0.24"
         data-rotation-deg="-7">
      <img id="asset_toilet_paper"
           data-asset-id="toilet_paper"
           data-repo-path="assets/brands/gsshop/layers/06_hero_toilet_paper.png"
           src="{{ asset_base }}/06_hero_toilet_paper.png"
           alt="Toilet paper 30-roll pack" />

  <script>
    (function syncCapsuleWidths() {
      const sync = () => {
        const capsule = document.getElementById("ui_glass_capsule");
        const cta = document.getElementById("ui_cta");
        if (!capsule || !cta) return;
        const w = Math.round(capsule.getBoundingClientRect().width);
        if (w > 0) {
          document.documentElement.style.setProperty("--synced-capsule-width", w + "px");
          cta.style.width = w + "px";
        }
      };
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(sync);
      }
      window.addEventListener("load", sync);
      sync();
    })();
  </script>
