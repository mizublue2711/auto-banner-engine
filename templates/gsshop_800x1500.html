      font-display: block;

    @font-face {
      font-family: "Pretendard";

    body {
      width: 800px;
      height: 1500px;
      overflow: hidden;
      background: #96dbfc;

    /* =========================================================================
       GS SHOP 800x1500 VERTICAL STORY (1:1.875) — TALL 3-TIER STACKING
       Tier 1 (Top y=120..540): Logo, Frosted Glass LIVE Capsule, Oversized 3D Title
       Tier 2 (Middle y=550..1240): Spacious Floating Lid, Products & White Gift Box
       Tier 3 (Bottom y=1040..1500): Rolling 3-Tier Snow Waves & Docked Bottom CTA
       Safe Margins: top 120, bottom 100, left 40, right 40
       ========================================================================= */
    .stage {
      position: relative;
      width: 800px;
      height: 1500px;
      overflow: hidden;
      isolation: isolate;
    }

    .layer {
      position: absolute;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .layer img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Z=1: Winter Sky Backdrop (800x1500 vertical cover) */
    .z1-bg-winter-backdrop {
      z-index: 1;
      top: 0px;
      left: 0px;
      width: 800px;
      height: 1500px;
    }
    .z1-bg-winter-backdrop img {
      object-fit: cover;
    }

    /* Z=2: Snow Tier 1 Back Dunes (Lower 460px of 1500px stage) */

      z-index: 2;
      top: 1040px;
      left: 0px;
      width: 800px;
      height: 460px;
      overflow: hidden;
    }
    .z2-snow-tier-1 img {
      position: absolute;
      left: -82px;
      top: -540px;
      width: 964px;
      height: 1180px;
      max-width: none;
      max-height: none;
      object-fit: fill;

    /* Z=3: Snow Tier 2 Box Bed (Spacious rolling snow floor supporting box) */

      height: 1160px;
      max-width: none;

    /* Shared-Camera 1:1 Box Projection (virtual 600x600 @ left: 100px, top: 694px) */
    /* Z=4: Box Contact Shadow */

    .z10-decor-snowflake,

      z-index: 10;

    .z10-decor-snowflake {

    }
    .z10-decor-snowflake img {

    .z10-decor-snowflake-copy img {

    .z10-decor-candy-cane img {

    .z10-decor-bauble-sparkles {
      z-index: 10;

    .z11-snow-tier-3 {

    /* =========================================================================

    .z13-logo-live-group {
      z-index: 13;
      top: 124px;
      left: 290px;

      top: -97.5px;

      height: 224.1px;
      max-width: none;
      max-height: none;
      object-fit: fill;
      display: block;

    /* Frosted Glass LIVE Capsule */

      z-index: 13;
      top: 194px;
      left: 50%;
      transform: translateX(-50%);
      width: auto;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .glass-subcopy-capsule {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 564px;
      gap: 16px;
      padding: 10px 26px 10px 14px;
      background: rgba(255, 255, 255, 0.74);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.86);
      border-radius: 9999px;
      box-shadow: 0 6px 24px -2px rgba(15, 23, 42, 0.10),
                  0 1px 3px rgba(255, 255, 255, 0.6) inset;
      margin: 0 auto;
    }

    .glass-badge-live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #DC2626;
      color: #FFFFFF;
      padding: 7px 15px;
      border-radius: 9999px;
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.6px;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.35);
      flex-shrink: 0;
    }

    .live-dot {
      width: 8.5px;
      height: 8.5px;
      background-color: #FFFFFF;
      border-radius: 50%;
      display: inline-block;
    }

    .glass-divider {
      width: 1px;
      height: 22px;
      background: rgba(15, 23, 42, 0.16);
      flex-shrink: 0;
    }

    .glass-subcopy-text {
      color: #0F172A;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    /* Oversized 3D Headline Lockup (Top Tier anchor) */
    .z13-headline-3d {
      z-index: 13;
      top: 280px;
      left: 40px;
      width: 720px;
      height: 248px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .headline-3d-lockup {
      position: relative;
      width: 604px;
      height: 248px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .headline-3d-lockup img {
      width: 1140px;
      height: 296px;
      margin-top: 4px;
      max-width: none;
      max-height: none;
      flex-shrink: 0;
      object-fit: contain;
      display: block;
    }

    /* Docked Bottom CTA Pill (Strictly above y=1400 safe margin & y=1420 nav clearance) */
    .z13-cta-button {
      z-index: 13;
      bottom: 116px;
      left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box;
      width: var(--synced-capsule-width, 564px);
      height: 70px;
      padding: 0 42px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      text-decoration: none;
      overflow: hidden;

      background: linear-gradient(
        180deg,
        #3392FF 0%,
        #1982FF 18%,
        #0F78FF 56%,
        #0C6CEB 88%,
        #167BFF 100%
      );
      border: 1.5px solid rgba(130, 194, 255, 0.78);
      box-shadow:
        0 12px 26px -4px rgba(15, 120, 255, 0.42),
        0 4px 12px rgba(15, 120, 255, 0.24),
        inset 0 2px 3px rgba(255, 255, 255, 0.42),
        inset 0 -3px 6px rgba(15, 92, 214, 0.30),
        inset 0 -1px 2px rgba(110, 184, 255, 0.38);
    }

    .z13-cta-button::before {
      content: "";
      position: absolute;
      top: 1px;
      left: 16px;
      right: 16px;
      height: 18px;
      border-radius: 9999px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.44) 0%,
        rgba(255, 255, 255, 0.14) 48%,
        rgba(255, 255, 255, 0.00) 100%
      );
      pointer-events: none;
    }

    .cta-pill-label {
      position: relative;
      z-index: 1;
      color: #FFFFFF;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      white-space: nowrap;
    }

    .cta-text {
      font-size: 35px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 1.7px;
      text-shadow: 0 2px 4px rgba(4, 48, 120, 0.38);
    }

    .cta-chevron {
      width: 16px;
      height: 25px;
      flex-shrink: 0;
      display: block;
      filter: drop-shadow(0 2px 3px rgba(4, 48, 120, 0.38));
    }

<body>
  <main class="stage" id="master-stage" data-banner-id="{{ banner_id }}" data-format="800x1500">
    <!-- Z=1: Winter Backdrop -->
    <div class="layer z1-bg-winter-backdrop"
         data-layer-id="z1_bg_winter_backdrop"
         data-layer-name="Z1_BG_WINTER_BACKDROP"
         data-z-index="1"
         data-motion-role="static_backdrop"
         data-parallax="0.02">
      <img id="asset_bg_winter_backdrop"
           data-asset-id="01_bg_winter_backdrop"
           data-repo-path="assets/brands/gsshop/layers/01_background_sky.png"
           src="{{ asset_base }}/01_background_sky.png"
           alt="Winter studio backdrop" />
    </div>

    <!-- Z=2: Snow Tier 1 Back -->
    <div class="layer z2-snow-tier-1"
         data-layer-id="z2_snow_tier_1_back_blur"
         data-layer-name="Z2_SNOW_TIER_1_BACK_BLUR"
         data-z-index="2"
         data-motion-role="snow_dune_back"
         data-parallax="0.06">
      <img id="asset_snow_tier_1"
           data-asset-id="snow_tier_1_back_blur"
           data-repo-path="assets/brands/gsshop/layers/02_snow_tier_1_back.png"
           src="{{ asset_base }}/02_snow_tier_1_back.png"
           alt="Background blurred snow dunes" />
    </div>

    <!-- Z=3: Snow Tier 2 Box Bed -->
    <div class="layer z3-snow-tier-2"
         data-layer-id="z3_snow_tier_2_box_bed"
         data-layer-name="Z3_SNOW_TIER_2_BOX_BED"
         data-z-index="3"
         data-motion-role="snow_bed_ground"
         data-parallax="0.10">
      <img id="asset_snow_tier_2"
           data-asset-id="snow_tier_2_box_bed"
           data-repo-path="assets/brands/gsshop/layers/03_snow_tier_2_box_bed.png"
           src="{{ asset_base }}/03_snow_tier_2_box_bed.png"
           alt="Main snow floor supporting gift box" />
    </div>

    <!-- Z=4: Box Contact Shadow -->
    <div class="layer z4-box-contact-shadow"
         data-layer-id="z4_box_contact_shadow"
         data-layer-name="Z4_BOX_CONTACT_SHADOW"
         data-z-index="4"
         data-motion-role="contact_shadow"
         data-parallax="0.14">
      <img id="asset_box_contact_shadow"
           data-asset-id="decor_box_contact_shadow"
           data-repo-path="assets/brands/gsshop/layers/04_decor_box_contact_shadow.png"
           src="{{ asset_base }}/04_decor_box_contact_shadow.png"
           alt="Gift box contact shadow" />
    </div>

    <!-- Z=5: Box Back Interior -->
    <div class="layer z5-box-back-interior"
         data-layer-id="z5_box_back_interior"
         data-layer-name="Z5_BOX_BACK_INTERIOR"
         data-z-index="5"
         data-motion-role="box_cavity_back"
         data-parallax="0.18">
      <img id="asset_box_back_interior"
           data-asset-id="decor_box_back_interior"
           data-repo-path="assets/brands/gsshop/layers/05_decor_box_back_interior.png"
           src="{{ asset_base }}/05_decor_box_back_interior.png"
           alt="Gift box back interior cavity" />
    </div>

    <!-- Z=6: Tucked Items -->
    <div class="layer z6-toilet-paper"
         data-layer-id="z6_toilet_paper"

  <script>
    (function syncCapsuleWidths() {
      const sync = () => {
        const capsule = document.getElementById("ui_glass_capsule");
        const cta = document.getElementById("ui_cta");
        if (!capsule || !cta) return;
        const w = Math.round(capsule.getBoundingClientRect().width);
        if (w > 0) {
          document.documentElement.style.setProperty("--synced-capsule-width", w + "px");
          cta.style.width = w + "px";
        }
      };
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(sync);
      }
      window.addEventListener("load", sync);
      sync();
    })();
  </script>
